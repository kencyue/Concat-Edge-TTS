name: Format standalone TTS branch
on:
  push:
    branches: [feature/standalone-edge-tts]
    paths:
      - ".github/workflows/format-standalone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-lock:
    if: github.ref == 'refs/heads/feature/standalone-edge-tts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use pinned compiler and formatter
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          rustup default 1.93.1
      - name: Format all Rust code and refresh dependency lock
        run: |
          cd src
          cargo fmt --all
          cargo metadata --format-version=1 > /dev/null
      - name: Commit formatting and lock updates only on feature branch
        run: |
          git config user.name "kencat-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/Cargo.lock src/crates
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style: rustfmt and lock native Edge TTS dependencies"
          git push origin HEAD:feature/standalone-edge-tts
