name: Vendor Android-compatible Edge TTS TLS
on:
  push:
    branches: [feature/standalone-edge-tts]
    paths:
      - ".github/workflows/vendor-standalone-msedge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.ref == 'refs/heads/feature/standalone-edge-tts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Pin and vendor audited upstream code
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/msedge-tts-0.4.1.crate \
            https://crates.io/api/v1/crates/msedge-tts/0.4.1/download
          echo "6c385e6272c1cf2502681eff68b2dd0e7226f9932fb618ed98e00c10082f0a44  /tmp/msedge-tts-0.4.1.crate" | sha256sum --check
          tar -xzf /tmp/msedge-tts-0.4.1.crate -C /tmp
          mkdir -p src/vendor/msedge-tts
          cp -R /tmp/msedge-tts-0.4.1/src src/vendor/msedge-tts/
          cp /tmp/msedge-tts-0.4.1/Cargo.toml src/vendor/msedge-tts/Cargo.toml
          cp /tmp/msedge-tts-0.4.1/LICENSE src/vendor/msedge-tts/LICENSE
          cp /tmp/msedge-tts-0.4.1/README.md src/vendor/msedge-tts/README.md
      - name: Use bundleable Mozilla trust roots for native Android TLS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cargo=Path('src/vendor/msedge-tts/Cargo.toml')
          t=cargo.read_text()
          # Avoid Android platform-verifier's separate Kotlin JNI/AAR dependency.
          t=t.replace('    "rustls-platform-verifier",\n', '', 1)
          assert t.count('    "rustls-platform-verifier",\n')==2, 'Unexpected features in upstream Cargo.toml'
          t+='\n[dependencies.webpki-roots]\nversion = "0.26.11"\n'
          cargo.write_text(t)
          mod=Path('src/vendor/msedge-tts/src/tts/mod.rs')
          s=mod.read_text().replace('\r\n', '\n')
          assert 'use rustls_platform_verifier::ConfigVerifierExt;' in s
          s=s.replace('use rustls_platform_verifier::ConfigVerifierExt;','')
          before='''    let config = ClientConfig::with_platform_verifier()
                  .map_err(|e| Error::Tls(TlsError::Rustls(Box::new(e))))?;'''
          if before not in s:
              print(s[s.index('let config = ClientConfig::with_platform_verifier()')-50:s.index('let config = ClientConfig::with_platform_verifier()')+200])
              raise ValueError('Unexpected rustls platform verifier expression')
          after='''    let mut roots = rustls::RootCertStore::empty();
              roots.extend(webpki_roots::TLS_SERVER_ROOTS.iter().cloned());
              let config = ClientConfig::builder()
                  .with_root_certificates(roots)
                  .with_no_client_auth();'''
          s=s.replace(before,after)
          mod.write_text(s)
          work=Path('src/Cargo.toml')
          t=work.read_text()
          assert '[patch.crates-io]' in t
          assert 'msedge-tts = { path = "vendor/msedge-tts" }' not in t
          t += '\n# Pin a local Android TLS-only adaptation of the MIT/Apache msedge-tts 0.4.1 source.\nmsedge-tts = { path = "vendor/msedge-tts" }\n'
          work.write_text(t)
          PY
      - name: Format and lock
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          rustup default 1.93.1
          cd src
          cargo fmt --all
          cargo metadata --format-version=1 > /dev/null
      - name: Commit vendored source in feature branch only
        shell: bash
        run: |
          git config user.name "kencat-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/Cargo.toml src/Cargo.lock src/crates
          git add -f src/vendor/msedge-tts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(android): bundle pure Rust trust roots for Edge TTS TLS"
          git push origin HEAD:feature/standalone-edge-tts
